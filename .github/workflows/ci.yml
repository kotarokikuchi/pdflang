name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Cheap and first: a version bump that forgets the docs fails here rather
      # than shipping. The docs had drifted three releases behind before this.
      - name: Docs version matches Cargo.toml
        run: ./scripts/sync-version.sh --check

      - name: Unit tests (no pdfium)
        run: cargo test --workspace --verbose

      - name: Build without warnings
        run: cargo build
        env:
          RUSTFLAGS: -Dwarnings

      - name: Download pdfium
        run: ./setup_pdfium.sh

      - name: Formatting of the examples
        run: |
          for f in examples/*.pdfl; do
            ./target/debug/pdfl fmt "$f" --check
          done

      - name: Smoke e2e
        run: |
          # the barcode script passes (exit 0)
          ./target/debug/pdfl run examples/barcodes.pdfl tests/fixtures/barcode.pdf --output json > /dev/null
          # inspect runs
          ./target/debug/pdfl inspect tests/fixtures/prepress.pdf
          # validation with an expected failure (exit 2)
          ec=0
          ./target/debug/pdfl run examples/basic.pdfl tests/fixtures/minimal.pdf --output json > /dev/null || ec=$?
          test "$ec" -eq 2
          # a broken input is not a verdict: it exits in the infrastructure
          # range, so CI can tell it apart from the failure just above
          printf 'not a pdf' > /tmp/broken.pdf
          ec=0
          ./target/debug/pdfl run examples/basic.pdfl /tmp/broken.pdf --output json > /dev/null || ec=$?
          test "$ec" -eq 10
          # report determinism
          ./target/debug/pdfl run examples/images.pdfl tests/fixtures/imagem.pdf --output json > /tmp/r1.json || true
          ./target/debug/pdfl run examples/images.pdfl tests/fixtures/imagem.pdf --output json > /tmp/r2.json || true
          cmp /tmp/r1.json /tmp/r2.json
          # the test runner: record, then verify against what was recorded
          mkdir -p /tmp/cases && cp tests/fixtures/*.pdf /tmp/cases/
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases --update
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases
          # a changed expectation has to fail, or the runner proves nothing
          sed -i 's/"total_pages_analyzed": [0-9]*/"total_pages_analyzed": 999/' /tmp/cases/minimal.expected.json
          ec=0
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases || ec=$?
          test "$ec" -eq 2
