name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Cheap and first: a version bump that forgets the docs fails here rather
      # than shipping. The docs had drifted three releases behind before this.
      - name: Docs version matches Cargo.toml
        run: ./scripts/sync-version.sh --check

      - name: Unit tests (no pdfium)
        run: cargo test --workspace --verbose

      - name: Build without warnings
        run: cargo build
        env:
          RUSTFLAGS: -Dwarnings

      - name: Download pdfium
        run: ./setup_pdfium.sh

      - name: Formatting of the examples
        run: |
          for f in examples/*.pdfl; do
            ./target/debug/pdfl fmt "$f" --check
          done

      - name: Smoke e2e
        run: |
          # the barcode script passes (exit 0)
          ./target/debug/pdfl run examples/barcodes.pdfl tests/fixtures/barcode.pdf --output json > /dev/null
          # inspect runs
          ./target/debug/pdfl inspect tests/fixtures/prepress.pdf
          # validation with an expected failure (exit 2)
          ec=0
          ./target/debug/pdfl run examples/basic.pdfl tests/fixtures/minimal.pdf --output json > /dev/null || ec=$?
          test "$ec" -eq 2
          # a broken input is not a verdict: it exits in the infrastructure
          # range, so CI can tell it apart from the failure just above
          printf 'not a pdf' > /tmp/broken.pdf
          ec=0
          ./target/debug/pdfl run examples/basic.pdfl /tmp/broken.pdf --output json > /dev/null || ec=$?
          test "$ec" -eq 10
          # report determinism
          ./target/debug/pdfl run examples/images.pdfl tests/fixtures/imagem.pdf --output json > /tmp/r1.json || true
          ./target/debug/pdfl run examples/images.pdfl tests/fixtures/imagem.pdf --output json > /tmp/r2.json || true
          cmp /tmp/r1.json /tmp/r2.json
          # the test runner: record, then verify against what was recorded
          mkdir -p /tmp/cases && cp tests/fixtures/*.pdf /tmp/cases/
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases --update
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases
          # one case per CPU has to reach the same verdict, in the same order
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases --jobs 0 > /tmp/par.txt
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases --jobs 1 > /tmp/seq.txt
          cmp /tmp/par.txt /tmp/seq.txt
          # a changed expectation has to fail, or the runner proves nothing
          sed -i 's/"total_pages_analyzed": [0-9]*/"total_pages_analyzed": 999/' /tmp/cases/minimal.expected.json
          ec=0
          ./target/debug/pdfl test examples/basic.pdfl --dir /tmp/cases || ec=$?
          test "$ec" -eq 2
          # watch --once: the report a batch writes must not depend on --jobs,
          # and rendering from a child's JSON must match rendering in place
          mkdir -p /tmp/w1 /tmp/w8
          ./target/debug/pdfl watch /tmp/cases --script examples/basic.pdfl \
            --output-dir /tmp/w1 --once --jobs 1 --report html || true
          ./target/debug/pdfl watch /tmp/cases --script examples/basic.pdfl \
            --output-dir /tmp/w8 --once --jobs 0 --report html || true
          diff -r /tmp/w1 /tmp/w8
          # same file by the same path, so only the rendering path differs
          ./target/debug/pdfl run examples/basic.pdfl /tmp/cases/minimal.pdf \
            --output html --output-file /tmp/direct.html || true
          cmp /tmp/w1/minimal.report.html /tmp/direct.html
          # the journal: a resumed batch does the work once and keeps the verdict
          mkdir -p /tmp/wj
          ec=0
          ./target/debug/pdfl watch /tmp/cases --script examples/basic.pdfl \
            --output-dir /tmp/wj --once --journal /tmp/batch.jsonl || ec=$?
          test "$ec" -eq 2                      # minimal.pdf is rejected
          test "$(wc -l < /tmp/batch.jsonl)" -eq 5
          rm -f /tmp/wj/*
          ec=0
          ./target/debug/pdfl watch /tmp/cases --script examples/basic.pdfl \
            --output-dir /tmp/wj --once --journal /tmp/batch.jsonl || ec=$?
          test "$ec" -eq 2                      # skipped, but still rejected
          test -z "$(ls /tmp/wj)"               # and nothing was validated again
          test "$(wc -l < /tmp/batch.jsonl)" -eq 5
          # --timeout composes with the rest without changing a normal batch;
          # the kill itself is proven in cargo test against a real slow process
          rm -f /tmp/wj/* /tmp/batch.jsonl
          ec=0
          ./target/debug/pdfl watch /tmp/cases --script examples/basic.pdfl \
            --output-dir /tmp/wj --once --timeout 30 --journal /tmp/batch.jsonl \
            --jobs 0 || ec=$?
          test "$ec" -eq 2
          # --var must reach the child a case/file is validated in, or a
          # script reading vars.* can never be tested or watched at all
          cat > /tmp/needs_var.pdfl <<'EOF'
          check "Has the var" {
            require vars.client == "AcmeCorp"
          }
          EOF
          ec=0
          ./target/debug/pdfl test /tmp/needs_var.pdfl --dir /tmp/cases \
            --var client=AcmeCorp --update || ec=$?
          test "$ec" -eq 0
          ./target/debug/pdfl test /tmp/needs_var.pdfl --dir /tmp/cases \
            --var client=AcmeCorp
          rm -rf /tmp/wv && mkdir -p /tmp/wv
          ./target/debug/pdfl watch /tmp/cases --script /tmp/needs_var.pdfl \
            --output-dir /tmp/wv --once --var client=AcmeCorp --jobs 0
          test -z "$(grep -l '"error_count": [1-9]' /tmp/wv/*.json || true)"
          test "$(wc -l < /tmp/batch.jsonl)" -eq 5
          # pixelcompare: a file against itself has to come out identical, or
          # every difference it reports elsewhere is suspect
          ec=0
          ./target/debug/pdfl pixelcompare tests/fixtures/prepress.pdf \
            tests/fixtures/prepress.pdf --dpi 72 > /tmp/same.json || ec=$?
          test "$ec" -eq 0
          grep -q '"similarity": 100' /tmp/same.json
          # two different files must differ, and the viewer must be complete
          rm -rf /tmp/px && ec=0
          ./target/debug/pdfl pixelcompare tests/fixtures/prepress.pdf \
            tests/fixtures/suspeito.pdf --dpi 72 --viewer /tmp/px > /dev/null || ec=$?
          test "$ec" -eq 2
          test -f /tmp/px/index.html
          test -f /tmp/px/page-001-before.png
          test -f /tmp/px/page-001-after.png
          test -f /tmp/px/page-001-diff.png
          # the viewer carries its own CSS and JS: no network, no bundler
          grep -q "PAGES = \[" /tmp/px/index.html
          ! grep -qE '<(script|link)[^>]+(src|href)="https?:' /tmp/px/index.html
          # the progress bar must never reach a redirected stderr: it works by
          # overwriting its line, and a log has no cursor to move
          ./target/debug/pdfl pixelcompare tests/fixtures/prepress.pdf \
            tests/fixtures/suspeito.pdf --dpi 72 >/dev/null 2>/tmp/px.err || true
          test ! -s /tmp/px.err
          # --jobs may make it faster, never make it say something else: the
          # fingerprints are in here, so this catches a fold taken out of order
          ./target/debug/pdfl pixelcompare tests/fixtures/prepress.pdf \
            tests/fixtures/suspeito.pdf --dpi 72 --jobs 1 > /tmp/px1.json || true
          ./target/debug/pdfl pixelcompare tests/fixtures/prepress.pdf \
            tests/fixtures/suspeito.pdf --dpi 72 --jobs 8 > /tmp/px8.json || true
          cmp /tmp/px1.json /tmp/px8.json
