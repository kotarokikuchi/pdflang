name: Release

on:
  push:
    # The tag is the bare version (0.6.2). `v*` stays accepted because v0.6.1
    # was already published that way — without it an old-style tag would trigger
    # nothing, the hardest kind of failure to diagnose.
    tags: ["[0-9]*", "v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # One platform failing must not cancel the others: each publishes its own
      # assets, and a partial release is easier to finish than to redo.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
          # macos-latest is Apple Silicon, so the Intel package is cross-built
          # from it. The Intel-hosted images queue for a long time and are on
          # their way out; the toolchain cross-compiles to x86_64 natively.
          - target: macos-amd64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            pdfium_asset: pdfium-mac-x64.tgz
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # bash on every runner: the Windows one defaults to PowerShell, and both
    # setup_pdfium.sh and the packaging step below are shell scripts.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: |
          TGT="${{ matrix.rust_target }}"
          if [ -n "$TGT" ]; then
            rustup target add "$TGT"
            cargo build --release --target "$TGT"
            echo "BIN=target/$TGT/release/pdfl" >> "$GITHUB_ENV"
          else
            cargo build --release
            echo "BIN=target/release/pdfl" >> "$GITHUB_ENV"
          fi

      - name: Download pdfium
        # Cross-building needs the library for the target, not for the runner.
        env:
          PDFIUM_ASSET: ${{ matrix.pdfium_asset }}
        run: ./setup_pdfium.sh

      - name: Package (binary + libpdfium + docs)
        run: |
          # The version goes in the artifact's name and in the directory inside
          # it, so a downloaded package stays identifiable after extraction.
          # In exchange, .../releases/latest/download/<name> no longer works: it
          # needs the exact name. CI installs use `gh release download
          # --pattern 'pdfl-*-<target>.*'` (see docs/*/12-*.md).
          VERSION="${GITHUB_REF_NAME#v}"   # tags 0.7.0 and v0.7.0 give the same name
          NAME="pdfl-${VERSION}-${{ matrix.target }}"
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          mkdir -p "dist/$NAME"
          cp "$BIN$EXE" "dist/$NAME/"
          cp -r pdfium "dist/$NAME/pdfium"
          # Only the shared library and the license texts have to ship. The C
          # headers and the build files are for people compiling against pdfium,
          # not for running pdfl. LICENSE, licenses/ and VERSION stay: the first
          # two are required to redistribute, the third says which build this is.
          rm -rf "dist/$NAME/pdfium/include" \
                 "dist/$NAME/pdfium/args.gn" \
                 "dist/$NAME/pdfium/PDFiumConfig.cmake"
          # On Windows lib/ holds only the import library, used at link time.
          # Elsewhere it holds libpdfium.so/.dylib, which is the whole point.
          [ "$RUNNER_OS" = "Windows" ] && rm -rf "dist/$NAME/pdfium/lib"
          cp README.md LICENSE "dist/$NAME/"
          cp -r examples "dist/$NAME/examples"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # zip, not tar.gz: Explorer opens it without extra tools. 7z ships
            # on the runner; Git Bash has no zip(1). Run it from inside dist/ so
            # the archive root is $NAME, matching the tar branch.
            (cd dist && 7z a -tzip "../$NAME.zip" "$NAME") > /dev/null
            sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          else
            tar -C dist -czf "$NAME.tar.gz" "$NAME"
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" || sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      # The archives above stay: the CI recipes in docs/*/12-*.md install from
      # them, and they need no privileges. What follows is the installable form
      # of the same build, one per platform.
      - name: Installer (.deb / .dmg / .exe)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="pdfl-${VERSION}-${{ matrix.target }}"

          case "$RUNNER_OS" in
          Linux)
            # /usr/bin/pdfl cannot find <exe dir>/pdfium, so libpdfium.so goes
            # to the multiarch directory and the loader resolves it — the path
            # bind_pdfium() falls back to. postinst refreshes the ld cache.
            case "$(uname -m)" in
              x86_64)  DEB_ARCH=amd64; TRIPLET=x86_64-linux-gnu ;;
              aarch64) DEB_ARCH=arm64; TRIPLET=aarch64-linux-gnu ;;
              *) echo "::error::unmapped architecture $(uname -m)"; exit 1 ;;
            esac
            ROOT="debroot"
            mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/lib/$TRIPLET" \
                     "$ROOT/usr/share/doc/pdfl" "$ROOT/usr/share/pdfl"
            cp "$BIN" "$ROOT/usr/bin/"
            cp pdfium/lib/libpdfium.so "$ROOT/usr/lib/$TRIPLET/"
            cp README.md "$ROOT/usr/share/doc/pdfl/"
            cp LICENSE "$ROOT/usr/share/doc/pdfl/copyright"
            cp -r examples "$ROOT/usr/share/pdfl/examples"
            cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: pdfl
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $DEB_ARCH
          Depends: libc6, libgcc-s1
          Maintainer: Kotaro Kikuchi <kotaro@pdflang.com>
          Homepage: https://github.com/kotarokikuchi/pdflang
          Description: Scripting language for validating PDFs
           pdfl runs .pdfl scripts that validate, compare and normalize PDF
           files, producing deterministic reports in JSON, CSV, HTML or PDF.
           Built for print shops, legal publishers and CI pipelines.
          CONTROL
            printf '#!/bin/sh\nset -e\nldconfig\n' > "$ROOT/DEBIAN/postinst"
            printf '#!/bin/sh\nset -e\nldconfig\n' > "$ROOT/DEBIAN/postrm"
            chmod 755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/postrm"
            OUT="pdfl_${VERSION}_${DEB_ARCH}.deb"
            dpkg-deb --build --root-owner-group "$ROOT" "$OUT"
            sha256sum "$OUT" > "$OUT.sha256"
            ;;
          macOS)
            # The .dmg carries the same layout as the tarball, so the binary
            # finds <exe dir>/pdfium/lib without anything being installed.
            OUT="$NAME.dmg"
            hdiutil create -volname "pdfl $VERSION" -srcfolder "dist/$NAME" \
                    -ov -format UDZO "$OUT"
            shasum -a 256 "$OUT" > "$OUT.sha256"
            ;;
          Windows)
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            [ -f "$ISCC" ] || { choco install innosetup -y --no-progress >/dev/null; }
            [ -f "$ISCC" ] || ISCC="$(command -v iscc)"
            OUT="$NAME-setup"
            # Absolute Windows paths: Inno resolves relative ones against the
            # .iss file's directory, so "dist\..." became "packaging\dist\...".
            HERE="$(cygpath -w "$PWD")"
            "$ISCC" //DAppVersion="$VERSION" //DSourceDir="$HERE\\dist\\$NAME" \
                    //DOutputDir="$HERE" //DOutputName="$OUT" \
                    packaging/pdfl.iss > /dev/null
            sha256sum "$OUT.exe" > "$OUT.exe.sha256"

            # .msi as well as .exe: the MSI is what deploys unattended, through
            # Group Policy, Intune or `msiexec /qn`. WiX is a dotnet tool, and
            # the runner already has the SDK.
            dotnet tool install --global wix --version 5.0.2 > /dev/null
            export PATH="$PATH:$HOME/.dotnet/tools"
            # MSI ProductVersion takes only x.y.z, so a tag like 1.0.0-rc1 would
            # be rejected outright. Feed it the numeric part alone.
            MSI_VERSION="$(printf '%s' "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
            wix build -arch x64 -d Version="$MSI_VERSION" \
                      -bindpath src="$HERE\\dist\\$NAME" \
                      -o "$NAME.msi" packaging/pdfl.wxs
            sha256sum "$NAME.msi" > "$NAME.msi.sha256"
            ;;
          esac

      - name: Publish to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
            *.deb
            *.deb.sha256
            *.dmg
            *.dmg.sha256
            *-setup.exe
            *-setup.exe.sha256
            *.msi
            *.msi.sha256
          generate_release_notes: true
