name: Release

on:
  push:
    # The tag is the bare version (0.6.2). `v*` stays accepted because v0.6.1
    # was already published that way — without it an old-style tag would trigger
    # nothing, the hardest kind of failure to diagnose.
    tags: ["[0-9]*", "v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # bash on every runner: the Windows one defaults to PowerShell, and both
    # setup_pdfium.sh and the packaging step below are shell scripts.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Download pdfium
        run: ./setup_pdfium.sh

      - name: Package (binary + libpdfium + docs)
        run: |
          # The version goes in the artifact's name and in the directory inside
          # it, so a downloaded package stays identifiable after extraction.
          # In exchange, .../releases/latest/download/<name> no longer works: it
          # needs the exact name. CI installs use `gh release download
          # --pattern 'pdfl-*-<target>.*'` (see docs/*/12-*.md).
          VERSION="${GITHUB_REF_NAME#v}"   # tags 0.7.0 and v0.7.0 give the same name
          NAME="pdfl-${VERSION}-${{ matrix.target }}"
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          mkdir -p "dist/$NAME"
          cp "target/release/pdfl$EXE" "dist/$NAME/"
          cp -r pdfium "dist/$NAME/pdfium"
          # Only the shared library and the license texts have to ship. The C
          # headers and the build files are for people compiling against pdfium,
          # not for running pdfl. LICENSE, licenses/ and VERSION stay: the first
          # two are required to redistribute, the third says which build this is.
          rm -rf "dist/$NAME/pdfium/include" \
                 "dist/$NAME/pdfium/args.gn" \
                 "dist/$NAME/pdfium/PDFiumConfig.cmake"
          # On Windows lib/ holds only the import library, used at link time.
          # Elsewhere it holds libpdfium.so/.dylib, which is the whole point.
          [ "$RUNNER_OS" = "Windows" ] && rm -rf "dist/$NAME/pdfium/lib"
          cp README.md LICENSE "dist/$NAME/"
          cp -r examples "dist/$NAME/examples"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # zip, not tar.gz: Explorer opens it without extra tools. 7z ships
            # on the runner; Git Bash has no zip(1). Run it from inside dist/ so
            # the archive root is $NAME, matching the tar branch.
            (cd dist && 7z a -tzip "../$NAME.zip" "$NAME") > /dev/null
            sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          else
            tar -C dist -czf "$NAME.tar.gz" "$NAME"
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" || sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - name: Publish to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          generate_release_notes: true
