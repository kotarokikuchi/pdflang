name: Release

on:
  push:
    # A tag é a versão nua (0.6.2). O `v*` continua aceito porque a v0.6.1 já
    # foi publicada assim — sem ele, uma tag antiga não dispararia nada, que é
    # a falha silenciosa pior de diagnosticar.
    tags: ["[0-9]*", "v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Baixar pdfium
        run: ./setup_pdfium.sh

      - name: Empacotar (binário + libpdfium + docs)
        run: |
          # A versão vai no nome do artefato e no diretório de dentro, para que
          # um pacote baixado continue identificável depois de extraído.
          # Em troca, .../releases/latest/download/<nome> deixa de servir: ele
          # exige o nome exato. Quem instala em CI usa `gh release download
          # --pattern 'pdfl-*-<alvo>.tar.gz'` (ver docs/*/12-*.md).
          VERSION="${GITHUB_REF_NAME#v}"   # tag 0.6.2 ou v0.6.2 dão o mesmo nome
          NAME="pdfl-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp target/release/pdfl "dist/$NAME/"
          cp -r pdfium "dist/$NAME/pdfium"
          cp README.md LICENSE "dist/$NAME/"
          cp -r examples "dist/$NAME/examples"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" || sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - name: Publicar no release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          generate_release_notes: true
