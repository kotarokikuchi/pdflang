[package]
name = "pdfl"
version = "0.11.0"
edition = "2021"
description = "Interpreter for the PDFLang language (.pdfl), for validating PDFs"
license = "MIT"
repository = "https://github.com/kotarokikuchi/pdflang"

[dependencies]
pdfium-render = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
sha2 = "0.10"
rxing = "0.9.2"
printpdf = "0.12.5"
tar = "0.4.46"
flate2 = "1.1.9"
lopdf = "0.44.0"
image = "=0.25.8"
