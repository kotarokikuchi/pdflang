[package]
name = "pdfl"
version = "0.18.0"
edition = "2021"
description = "Interpreter for the PDFLang language (.pdfl), for validating PDFs"
license = "MIT"
repository = "https://github.com/kotarokikuchi/pdflang"

[dependencies]
pdfium-render = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a JSON object's keys in file order, which is what turns
# an array of objects into columns a person recognises.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
regex = "1"
sha2 = "0.10"
rxing = "0.9.2"
printpdf = "0.12.5"
tar = "0.4.46"
flate2 = "1.1.9"
lopdf = "0.44.0"
image = "=0.25.8"
notify = "8"
